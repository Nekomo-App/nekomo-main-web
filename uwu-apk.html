<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading...</title>
    <script>
        async function fetchLatestRelease() {
            const apiUrl = 'https://api.github.com/repos/Nekomo-App/Nekomo/releases/latest';
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const asset = data.assets.find(asset => asset.name.endsWith('.apk') || asset.name.endsWith('.zip') || asset.name.endsWith('.exe'));

                if (asset) {
                    window.location.href = asset.browser_download_url;
                } else {
                    console.error('No suitable asset found for download.');
                }
            } catch (error) {
                console.error('Error fetching the latest release:', error);
            }
        }

        window.onload = fetchLatestRelease;
    </script>
</head>
<body>
</body>
</html>
