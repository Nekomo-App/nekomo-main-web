<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekomo App APK</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff; /* Set text color to white */
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            color: #fff; /* Set heading color to white */
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 0 20px;
        }
        .download-link {
            margin-top: 20px;
        }
        .download-link a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff; /* Set button background color */
            color: #fff; /* Set button text color */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .download-link a:hover {
            background-color: #0056b3; /* Darker shade of blue on hover */
        }
    </style>
    <script type="text/javascript" nonce="fc25d4e80be44279bad641d27b9" src="//local.adguard.org?ts=1711665062457&amp;type=content-script&amp;dmn=neocities.org&amp;url=https%3A%2F%2Fneocities.org%2Fsite_files%2Fdownload%2Fuwu-apk.html%3F_%3D1711667025437&amp;app=brave.exe&amp;css=3&amp;js=1&amp;rel=1&amp;rji=1&amp;sbe=1&amp;stealth=1&amp;st-loc&amp;st-dnt"></script>
<script type="text/javascript" nonce="fc25d4e80be44279bad641d27b9" src="//local.adguard.org?ts=1711665062457&amp;name=AdGuard%20Extra%20%28Beta%29&amp;name=AdGuard%20Popup%20Blocker%20%28Beta%29&amp;type=user-script"></script><script>
        // Function to fetch latest release or prerelease download link from GitHub
        async function getLatestDownload() {
            const response = await fetch('https://api.github.com/repos/Nekomo-App/Nekomo/releases/latest');
            const data = await response.json();
            const downloadUrl = data.assets[0].browser_download_url;
            const prerelease = data.prerelease;

            // If it's a prerelease, fetch latest prerelease
            if (prerelease) {
                const prereleaseResponse = await fetch('https://api.github.com/repos/Nekomo-App/Nekomo/releases/latest');
                const prereleaseData = await prereleaseResponse.json();
                const prereleaseDownloadUrl = prereleaseData.assets[0].browser_download_url;
                updateDownloadButton(prereleaseDownloadUrl);
            } else {
                updateDownloadButton(downloadUrl);
            }
        }

        // Function to update download button with the provided URL
        function updateDownloadButton(url) {
            const downloadButton = document.getElementById('download-button');
            downloadButton.href = url;
            downloadButton.setAttribute('download', 'nekomo-app.apk'); // Set filename for download
            downloadButton.innerText = 'Download Latest Version'; // Update button text
        }

        // Call the function to fetch latest download link on page load
        window.onload = function() {
            getLatestDownload();
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>Nekomo App APK</h1>
        <p>Welcome to the official website of Nekomo App!</p>
        <p>Download the latest version below:</p>
        <div class="download-link">
            <a id="download-button" href="#">Fetching latest version...</a>
        </div>
    </div>
</body>
</html>
