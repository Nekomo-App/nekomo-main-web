<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekomo Anime App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 0 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nekomo Anime App</h1>
        <p>Welcome to Nekomo, your go-to anime streaming app!</p>
        <p>Explore a vast library of your favorite anime series and movies.</p>
        <a href="https://github.com/Nekomo-App/Nekomo" class="btn">Visit Our GitHub Repository</a>
    </div>
</body>
</html>
